name: Nightly Maintenance

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Run Composer Audit
        run: composer audit

  nightly-tests:
    name: Latest Dependencies Test
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:6bWb1z8bN+K7Xk9D1h1p2X4y5z6a7b8c9d0e1f2g3h4=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build assets
        run: |
          npm ci || npm install
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          tools: composer:v2

      - name: Update dependencies to latest
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run Quality Gate Suite
        run: composer run ci
